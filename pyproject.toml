[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stt-tts-local"
version = "0.1.0"
description = "Local Qwen3 ASR and TTS speech service; project data and caches on D drive"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "qwen-asr==0.0.6",
    "aiohttp>=3.12,<4",
    "av>=14,<17",
    "onnxruntime==1.31.1",
    "sentencepiece==0.2.1",
    "transformers==4.57.6",
    "accelerate==1.12.0",
    "numpy==1.26.4",
    "librosa==0.11.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper==1.2.1"]

[project.scripts]
stt-tts = "stt_tts.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stt_tts*"]

[tool.setuptools.package-data]
stt_tts = ["web/*"]
